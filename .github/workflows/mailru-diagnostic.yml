name: mailru-diagnostic
on:
  push:
    paths:
      - '.github/workflows/mailru-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Inspect Mail.ru public folder
        shell: bash
        run: |
          cat > /tmp/inspect_mailru.py <<'PY'
          import asyncio, json, pathlib
          from playwright.async_api import async_playwright

          URL = "https://cloud.mail.ru/public/H9cv/5nRmemDQ1"
          out = pathlib.Path("diag")
          out.mkdir(exist_ok=True)
          events = []

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  async def on_response(resp):
                      u = resp.url
                      if ("cloud.mail.ru" in u or "datacloudmail" in u or "cldmail" in u) and any(k in u for k in ["/api/", "weblink", "public", "dispatcher", "folder"]):
                          rec = {"url": u, "status": resp.status, "headers": await resp.all_headers()}
                          try:
                              ct = rec["headers"].get("content-type","")
                              if "json" in ct or "text" in ct or "javascript" in ct:
                                  body = await resp.text()
                                  rec["body"] = body[:200000]
                          except Exception as e:
                              rec["body_error"] = repr(e)
                          events.append(rec)
                  page.on("response", on_response)
                  await page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                  await page.wait_for_timeout(15000)
                  out.joinpath("title.txt").write_text(await page.title(), encoding="utf-8")
                  try:
                      out.joinpath("body.txt").write_text((await page.locator("body").inner_text())[:50000], encoding="utf-8")
                  except Exception:
                      pass
                  resources = await page.evaluate("""performance.getEntriesByType('resource').map(x => x.name)""")
                  out.joinpath("resources.json").write_text(json.dumps(resources, ensure_ascii=False, indent=2), encoding="utf-8")
                  out.joinpath("events.json").write_text(json.dumps(events, ensure_ascii=False, indent=2), encoding="utf-8")
                  print("TITLE:", await page.title())
                  print("BODY:", (await page.locator("body").inner_text())[:3000])
                  print("EVENT_COUNT:", len(events))
                  for i, e in enumerate(events):
                      print("EVENT", i, e["status"], e["url"])
                      if "body" in e:
                          print(e["body"][:4000])
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/inspect_mailru.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mailru-diagnostic
          path: diag/
          retention-days: 2
